name: Generate Android icon

on:
  push:
    branches:
      - main
    paths:
      - "mobile/assets/icon.svg"
      - ".github/workflows/generate-icon.yml"

permissions:
  contents: write

jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render icon PNG
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick librsvg2-bin
          rsvg-convert -w 1024 -h 1024 mobile/assets/icon.svg -o mobile/assets/icon.png
      - name: Commit generated icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/assets/icon.png
          git diff --cached --quiet || git commit -m "chore(android): generate icon PNG"
          git push
