name: Android Preview APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate PNG icon
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 mobile/assets/icon.svg -o mobile/assets/icon.png

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Install dependencies
        run: npm install

      - name: Build Android preview APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx eas-cli build --platform android --profile preview --non-interactive --no-wait

      - name: Wait for EAS build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          for i in $(seq 1 90); do
            STATUS=$(npx eas-cli build:list --platform android --status finished --limit 1 --json | node -e "let s=\"\";process.stdin.on(\"data\",d=>s+=d).on(\"end\",()=>{const a=JSON.parse(s);console.log(a[0]?.status||\"\")})")
            [ "$STATUS" = "FINISHED" ] && break
            sleep 20
          done

      - name: Download APK from EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          URL=$(npx eas-cli build:list --platform android --status finished --limit 1 --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s); console.log(a[0]?.artifacts?.buildUrl||'')})")
          test -n "$URL"
          curl -L "$URL" -o TSCS-Telekom-preview.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TSCS-Telekom-preview-apk
          path: mobile/TSCS-Telekom-preview.apk
          if-no-files-found: error
